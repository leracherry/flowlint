name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm stress
      - run: pnpm verify:package
      - run: node dist/cli.js check examples/valid.ndjson
      - name: Verify lint findings fail CI with exit code 1
        shell: bash
        run: |
          set +e
          node dist/cli.js check examples/invalid.ndjson --format json
          trace_status=$?
          set -e
          test "$trace_status" -eq 1
