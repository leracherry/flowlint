name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm stress
      - run: pnpm verify:package
      - name: Verify the recorded-evidence demo
        run: node scripts/demo.mjs
      - run: node dist/cli.js check examples/valid.ndjson
      - name: Verify lint findings fail CI with exit code 1
        shell: bash
        run: |
          set +e
          node dist/cli.js check examples/invalid.ndjson --format json
          trace_status=$?
          set -e
          test "$trace_status" -eq 1
      - name: Check a corpus with GitHub annotations
        run: node dist/cli.js suite "examples/{valid,interleaved,chunks,reasoning,state,activity,preservation}.ndjson" --format github
      - name: Write corpus summary
        shell: bash
        run: node dist/cli.js suite "examples/{valid,interleaved,chunks,reasoning,state,activity,preservation}.ndjson" --format markdown >> "$GITHUB_STEP_SUMMARY"
  html-report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:html
