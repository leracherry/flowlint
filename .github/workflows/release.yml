name: GitHub Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Verify tag matches package version
        run: node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) process.exit(1)'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm stress
      - run: pnpm verify:package
  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:package
      - name: Create release with package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum *.tgz > SHA256SUMS)
          node scripts/release-notes.mjs
          gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS --verify-tag --notes-file release/notes.md --title "FlowLint $GITHUB_REF_NAME"
